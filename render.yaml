databases:
  - name: lbh-db
    plan: starter
    databaseName: leveraged_bh
    user: lbh_user

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: lbh-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lbh-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: '["https://lbh-frontend.onrender.com","https://lbh-frontend-val7h.onrender.com"]'
      # Stripe (adicionar no dashboard do Render)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ── Frontend (Next.js) ────────────────────────────────────────
  - type: web
    name: lbh-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://lbh-backend.onrender.com
      # Stripe (adicionar no dashboard do Render)
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
