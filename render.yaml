# Render Blueprint — LBH System
# 1 service web (Next.js standalone, API routes incluidas).
# Backend Python foi removido. Quando o Track Backend reativar Postgres,
# adicione a seccao "databases:" e o envVar DATABASE_URL.fromDatabase.

services:
  - type: web
    name: lbh-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Cache (Upstash Redis - HTTP). Configurar no dashboard do Render.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Database (futuro). Configurar no dashboard quando reativar Postgres.
      - key: DATABASE_URL
        sync: false
      # Stripe (opcional - modo demo nao precisa).
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
