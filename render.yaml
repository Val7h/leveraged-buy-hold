# Render Blueprint — LBH System
# CONTAINER ÚNICO: Next.js (standalone) + FastAPI (motor quant) no mesmo serviço.
# O Next.js fala com o FastAPI em http://127.0.0.1:8001 (interno, não exposto).
# Ver Dockerfile + start.sh.

services:
  - type: web
    name: lbh-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter        # subir p/ standard se faltar memória (Next + pandas/numpy juntos)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # ── BFF interno: Next → FastAPI no mesmo container ──────────────────────
      - key: BACKEND_INTERNAL_URL
        value: http://127.0.0.1:8001
      # Token compartilhado: lido pelo BFF (Node) e pelo FastAPI (Python) — mesmo container.
      - key: BACKEND_INTERNAL_TOKEN
        generateValue: true

      # ── Cache (Upstash Redis - HTTP). Configurar no dashboard. ──────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Notícias (Finnhub). Sem a chave, /news retorna vazio graciosamente. ─
      - key: FINNHUB_API_KEY
        sync: false

      # ── Banco (Prisma/Supabase) ─────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── Email transacional (Resend). Sem RESEND_API_KEY fica em modo stub. ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ── URL pública (links de email, reset de senha etc) ────────────────────
      - key: NEXT_PUBLIC_APP_URL
        value: https://lbh-system.onrender.com

      # ── Stripe (opcional - modo demo não precisa) ───────────────────────────
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

      # ── Motor Quant: taxas de referência por mercado ────────────────────────
      # Atualizar em cada ciclo do COPOM/Fed. Gate EY usa estes limiares.
      - key: SELIC_RATE
        value: "0.135"   # Selic atual (jun/2026). BR hurdle = Selic+2pp = 15.5%
      - key: RF_USD
        value: "0.045"   # Fed funds / T-10Y americano (jun/2026). US/EUR hurdle = RF_USD+2pp = 6.5%
