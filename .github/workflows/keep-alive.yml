name: Keep Alive — LBH System

# Previne cold start do Render Free Tier (instâncias hibernam após ~15 min de inatividade).
# Faz ping no endpoint /api/health a cada 10 minutos para manter o serviço aquecido.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LBH System Health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lbh-system.onrender.com/api/health)
          echo "lbh-system: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ LBH System ativo (cold start evitado)"
          else
            echo "⚠️ LBH System retornou $STATUS"
          fi
