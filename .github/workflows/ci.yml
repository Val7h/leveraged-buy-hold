name: CI — golden tests do motor quant

# Trava regressão silenciosa no motor de decisão de capital: a cada push/PR, roda os
# golden tests puros (sem rede, determinísticos). O backtest NÃO entra aqui (depende de
# dados ao vivo do Yahoo = flaky/lento em CI); roda manualmente como estudo.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  quant-golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # engine é lazy (não conecta); valores dummy evitam qualquer surpresa no import.
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-dummy-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Golden tests (lógica quant)
        run: python -m pytest tests/test_quant_golden.py -q
      - name: Backtest determinístico (offline)
        # Exercita a LÓGICA pura do motor ADC (lots/dívida-por-fluxo, stops
        # escalonados, deploy de SHY em capitulação, point-in-time, B&H) sobre
        # séries sintéticas inline. SEM rede (não toca o Yahoo) -> safe no CI.
        run: python -m pytest tests/test_adc_backtest_offline.py -q
