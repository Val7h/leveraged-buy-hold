name: CI — golden tests do motor quant

# Trava regressão silenciosa no motor de decisão de capital: a cada push/PR, roda os
# golden tests puros (sem rede, determinísticos). O backtest NÃO entra aqui (depende de
# dados ao vivo do Yahoo = flaky/lento em CI); roda manualmente como estudo.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  quant-golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # engine é lazy (não conecta); valores dummy evitam qualquer surpresa no import.
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-dummy-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Golden tests (lógica quant)
        run: python -m pytest tests/test_quant_golden.py -q
      - name: Backtest determinístico (offline)
        # Exercita a LÓGICA pura do motor ADC (lots/dívida-por-fluxo, stops
        # escalonados, deploy de SHY em capitulação, point-in-time, B&H) sobre
        # séries sintéticas inline. SEM rede (não toca o Yahoo) -> safe no CI.
        run: python -m pytest tests/test_adc_backtest_offline.py -q
      - name: Score de crypto (lógica pura)
        # Framework Pal/Hayes/Woo: renormalização de fatores on-chain ausentes,
        # leverage caps por ativo (BTC 2x/ETH 1.75x/top10 1.25x), circuit breaker,
        # funding contrarian. Fontes monkeypatchadas (sem rede).
        run: python -m pytest tests/test_crypto_scoring.py -q
      - name: Travas de portfólio (Fase 2)
        # Stop de tese objetivo, trava de duração, choque de crédito, exposição
        # agregada. Posições/fundamentos sintéticos (sem rede).
        run: python -m pytest tests/test_portfolio_travas.py -q
      - name: Tático US (detecção cíclica)
        # Whitelist positiva de cíclicas US + proteção de compounders; auto corr/σ
        # desligada p/ US (ruído do S&P tech). Predicado puro + constantes.
        run: python -m pytest tests/test_tatico_us.py -q
      - name: Europe ADR (universo)
        # Tickers europeus de bolsa local trocados por ADR US líquido; carga do
        # universo sem duplicados nem sufixo de bolsa local inesperado.
        run: python -m pytest tests/test_europe_adr.py -q
      - name: Dividend recorrente + beta/leverage guards
        # Exclusão de dividendo extraordinário (dy recorrente), guard de beta
        # negativo implausível e trava de alavancagem em beta>=1.45 (sobrevivência).
        run: python -m pytest tests/test_ranking_dividend_beta.py -q
      - name: Camada 3 — aptidão p/ alavancar (por-ativo)
        # Score de aptidão (máxDD/σ/gap/DY/recuperação/beta) + teto de alavancagem
        # por-fluxo MIN(σ,gap,beta,regime); máxDD/Kelly são travas agregadas (C.3).
        run: python -m pytest tests/test_camada3_aptidao.py -q
      - name: Camada 3 — cap agregado que força (C.3)
        # Alavancagem efetiva ajustada por correlação, cap duro 2.5x, máxDD/Kelly
        # da cesta, max_lev_novo_fluxo com VETO sobre a guidance de aporte.
        run: python -m pytest tests/test_c3_agregado.py -q
      - name: Camada 2 — momento de entrada
        # compute_momentum refeito (desconto×reversão/tendência primária/valuation
        # relativo/osciladores+divergência/momentum relativo/estrutura) + gate de
        # reversão (sem quique→teto JUSTO) + tendência→capa alavancagem.
        run: python -m pytest tests/test_camada2_momento.py -q
      - name: Praga yfinance — fallback chart API no data source
        # fetch_price_history cai p/ _chart_api_df (Yahoo via urllib) quando yfinance
        # falha (bloqueado no Render); conserta market-state/Sharpe/Backtest.
        run: python -m pytest tests/test_market_data_chartapi.py -q
      - name: Backtest na doutrina (fluxos, não patrimônio)
        # _run_adaptive_strategy alavanca FLUXOS (dívida fixa por aporte, stop ⅓,
        # SHY, desalavancagem natural) — espelha a ESTRATÉGIA MASTER do Simulador.
        run: python -m pytest tests/test_backtest_doutrina.py -q
